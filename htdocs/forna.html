<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Forna Highlight Test</title>
  <link rel="stylesheet" href="/css/fornac.css">
  <script src="/js/d3.v3.min.js"></script>
  <script src="/js/fornac.js"></script>
</head>
<body>
  <div id="rna_ss" style="height: 500px;"></div>

  <script>
    window.onload = function () {
      const container = new fornac.FornaContainer("#rna_ss", {
        animation: false,
        applyForce: false,
        labelInterval: 28,
        drawBackground: true
      });

      const structure = "((((....))))........((((....))))........((((....))))....";
      const sequence  = "GCGCUUCGCCGAACGCGGAUUGCCAGGAGCUAAGGCUACGGAUUGCUAAGGAAAAA";

      container.addRNA(structure, {
        sequence: sequence
      });

      // Build 1-based index color string (28–44 inclusive)
      let colorText = "";
      for (let i = 28; i <= 44; i++) {
        colorText += i + ":red ";
      }

      // Second region: 50–55 in blue
        for (let i = 50; i <= 55; i++) {
        colorText += i + ":yellow ";
        }
        // Second region: 50–55 in blue
        for (let i = 1; i <= 25; i++) {
        colorText += i + ":orange ";
        }

      container.addCustomColorsText(colorText.trim());
    };
  </script>
</body>
</html>
