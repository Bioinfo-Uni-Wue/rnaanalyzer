<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Input Mask of Andom</title>
    <link rel="icon" href="http://www.bork.embl-heidelberg.de/AnDom/embl.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <base target="_self">
    <meta name="robots" content="INDEX">
</head>
<body>
    <header>
        <h1>Main Input Mask of Andom</h1>
    </header>
    <main>
        <form method="post" action="../../AnDom/cgi/start_impala.cgi">
            <section>
                <h2><a href="Usage.html#Identifiers" target="_new">Identifiers</a></h2>
                <input name="seqid" type="text" placeholder="e.g. KPY1_ECOLI or P14178 or 2506795">
            </section>

            <hr>

            <section>
                <h2><a href="Usage.html#Identifiers" target="_new">Sequence</a></h2>
                <label for="sequence">FASTA-format or raw sequence (digits are ignored):</label>
                <textarea id="sequence" cols="65" rows="8" name="seq">REMOVEMEPLEASE</textarea>
            </section>

            <section>
                <input value="Run" type="submit">
                <input value="Reset form" type="reset">
            </section>

            <hr>

            <section>
                <h2><a href="Usage.html#Parameters" target="_new">Parameters</a></h2>
                <table>
                    <tr>
                        <td>Method:</td>
                        <td>
                            <select name="method">
                                <option>IMPALA</option>
                                <option selected="selected">RPS-BLAST</option>
                            </select>
                        </td>
                        <td><span style="color: #FF0000;">01/08/03: RPS-BLAST was added (c.f. <a href="Usage.html#Method">Method</a>)</span></td> 
                    </tr>
                    <tr>
                        <td>Database:</td>
                        <td>
                            <select name="database">
                                <option selected="selected">SCOP 1.59</option>
                            </select>
                        </td>
                        <td><span style="color: #00C100;">02/07/16: SCOP 1.59 was added</span></td>
                    </tr>
                    <tr>
                        <td>Expect:</td>
                        <td>
                            <select name="expect">
                                <option>1e-10</option>
                                <option>1e-5</option>
                                <option>1e-3</option>
                                <option>1e-2</option>
                                <option>1</option>
                                <option selected="selected">10</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Filter:</td>
                        <td>
                            <input checked="checked" value="Y" name="seg" type="checkbox">
                            Low complexity (SEG)
                        </td>
                    </tr>
                </table>
            </section>
        </form>

        <hr>

        <!-- Optional contact info can be uncommented if needed -->
        <!-- <address><a href="mailto:schmidt@embl-heidelberg.de">Steffen Schmidt</a></address> -->

        <footer>
            <p>Last modified: Thu Jul 18 15:47:43 CEST 2002</p>
        </footer>
    </main>
</body>
</html>
