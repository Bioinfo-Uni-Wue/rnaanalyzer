<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SVG Zoom Test</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }
    #rna-container {
      width: 650px;
      margin: 0 auto;
    }
    object {
      border: 1px solid #ccc;
    }
  </style>

  <!-- Load svg-pan-zoom library -->
  <script src="/js/svg-pan-zoom.min.js"></script>
</head>
<body>
  <h2>RNA Structure (SVG Zoom Test)</h2>

  <div id="rna-container">
    <!-- Replace the data path with your real SVG path -->
    <image id="rna_svg" img type="svg" src="http://localhost/1437_ss.svg" width="452" height="452"></object>
    <p style="font-size: 0.9em; color: gray;">🖱️ Drag to pan, scroll to zoom</p>
  </div>

  <script>
    window.onload = function () {
      const obj = document.getElementById("rna_svg");
  
      obj.addEventListener("load", function () {
        const svg = obj.contentDocument.querySelector("svg");
        if (!svg) return console.error("SVG not found");
  
        svg.setAttribute("id", "zoom-target");
  
        svgPanZoom("#zoom-target", {
          zoomEnabled: true,
          controlIconsEnabled: true,
          fit: true,
          center: true
        });
      });
    };
  </script>
</body>
</html>
