upstream app_backend {
    server rnaanalyzer-app:9000;
}


server {
    listen 80;
    server_name localhost;

    # Document root (ensure this volume is shared between containers)
    root /var/www/rnaanalyzer/htdocs;
    index index.html;

    # Serve CGI files via the app container
    location /cgi-bin/ {
         gzip off;
         root /var/www/rnaanalyzer;
         # Use the app container's service name to reach fcgiwrap
         fastcgi_pass app_backend;
         include /etc/nginx/fastcgi_params;
         fastcgi_param SCRIPT_FILENAME /var/www/rnaanalyzer$fastcgi_script_name;
         fastcgi_param SCRIPT_NAME $fastcgi_script_name;
         fastcgi_param DOCUMENT_ROOT /var/www/rnaanalyzer/;
         autoindex on;
         allow all;
    }

    # Static files handling (HTML, CSS, JS, etc.)
    location / {
        try_files $uri $uri/ =404;
        autoindex on;
        allow all;
    }
    
    # Handling the tmp directory
    location /tmp/ {
        alias /var/www/rnaanalyzer/tmp/;
        autoindex on;
        allow all;
    }
}

