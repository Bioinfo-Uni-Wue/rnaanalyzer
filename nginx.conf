server {
    listen 80;
    server_name localhost;

    # Document root
    root /var/www/rnaanalyzer/htdocs;
    index index.html;


    # Serve CGI files
    location /cgi-bin/ {
         gzip off;
         root /var/www/rnaanalyzer;
         #fastcgi_pass unix:/var/run/fcgiwrap.socket;
         fastcgi_pass 127.0.0.1:9000;
         include /etc/nginx/fastcgi_params;
         #include fastcgi_params;
         fastcgi_param SCRIPT_FILENAME /var/www/rnaanalyzer$fastcgi_script_name;
         fastcgi_param SCRIPT_NAME $fastcgi_script_name;
         fastcgi_param DOCUMENT_ROOT /var/www/rnaanalyzer/;
         autoindex on;
         allow all;
    }

    # Static files handling (HTML, CSS, JS, etc.)
    location / {
        try_files $uri $uri/ =404;
        autoindex on;
        allow all;
    }
    
    # Handling the tmp directory
    location /tmp/ {
        alias /var/www/rnaanalyzer/tmp/;
        autoindex on;
        allow all;
    }
}

