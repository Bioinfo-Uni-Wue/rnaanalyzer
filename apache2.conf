<VirtualHost *>
    ServerName rnaanalyzer.bioapps2.biozentrum.uni-wuerzburg.de
    ServerAdmin stefan.obermeier@biozentrum.uni-wuerzburg.de

     # log IP addresses
    HostnameLookups Off

    UseCanonicalName Off
    ServerSignature On


    # Document root
    DocumentRoot /storage/srv/bioapps/rnaanalyzer/htdocs
    DirectoryIndex server.html

    <Directory /storage/srv/bioapps/rnaanalyzer/htdocs>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # CGI configuration
    ScriptAlias /cgi-bin/ /storage/srv/bioapps/rnaanalyzer/cgi-bin/

    <Directory "/storage/srv/bioapps/rnaanalyzer/cgi-bin">
        Options +ExecCGI -Indexes
        AddHandler cgi-script .cgi .pl .py
        Require all granted
    </Directory>

    # Alias for /tmp/
    Alias /tmp/ /storage/srv/bioapps/rnaanalyzer/tmp/

    <Directory /storage/srv/bioapps/rnaanalyzer/tmp>
        Options -Indexes
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/rnaanalyzer-error_log
    CustomLog /var/log/apache2/rnaanalyzer-access_log combined

</VirtualHost>

