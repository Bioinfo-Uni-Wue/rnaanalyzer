<VirtualHost *:80>
    ServerName localhost

    # Document root
    DocumentRoot /home/ama55id/rnaanalyzer/htdocs
    DirectoryIndex server.html

    <Directory /home/ama55id/rnaanalyzer/htdocs>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # CGI configuration
    ScriptAlias /cgi-bin/ /home/ama55id/rnaanalyzer/cgi-bin/

    <Directory "/home/ama55id/rnaanalyzer/cgi-bin">
        Options +ExecCGI
        AddHandler cgi-script .cgi .pl .py
        Require all granted
    </Directory>

    # Alias for /tmp/
    Alias /tmp/ /home/ama55id/rnaanalyzer/tmp/

    <Directory /home/ama55id/rnaanalyzer/tmp>
        Options Indexes
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/rnaanalyzer_error.log
    CustomLog ${APACHE_LOG_DIR}/rnaanalyzer_access.log combined
</VirtualHost>

